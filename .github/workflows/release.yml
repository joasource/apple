name: Build Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versao da release (ex.: v1.0.0)"
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Determinar versao da release
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r apple_toolkit/requirements.txt
          pip install pyinstaller

      - name: Instalar e preparar GnuPG (via Chocolatey) para embutir
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Instalando GnuPG via Chocolatey..."
          choco install gnupg -y --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) {
            Write-Error "choco install gnupg falhou com exit code $LASTEXITCODE"
            exit 1
          }
          Write-Host "Instalacao concluida. Procurando gpg.exe..."
          $gpgExe = Get-ChildItem -Path "C:\Program Files*","C:\ProgramData\chocolatey" -Recurse -Filter "gpg.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gpgExe) {
            Write-Error "gpg.exe nao foi encontrado apos a instalacao via choco"
            exit 1
          }
          $binDir = $gpgExe.Directory.FullName
          Write-Host "GnuPG bin encontrado em: $binDir"
          New-Item -ItemType Directory -Force -Path "$PWD\gnupg-bin" | Out-Null
          Copy-Item -Path "$binDir\*" -Destination "$PWD\gnupg-bin" -Recurse -Force
          Write-Host "Copia para gnupg-bin concluida."

      - name: Compilar executavel Windows
        run: |
          pyinstaller --onefile --windowed --name JoaKApple `
            --collect-data customtkinter `
            --add-binary "${{ github.workspace }}\gnupg-bin;gnupg-bin" `
            --distpath dist --workpath build --specpath build `
            apple_toolkit/gui.py

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/JoaKApple.exe

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r apple_toolkit/requirements.txt
          pip install pyinstaller

      - name: Compilar binario Linux
        run: |
          pyinstaller --onedir --windowed --name JoaKApple \
            --collect-data customtkinter \
            --distpath dist --workpath build --specpath build \
            apple_toolkit/gui.py

      - name: Montar AppDir
        run: |
          set -e
          mkdir -p AppDir/usr/bin
          cp -r dist/JoaKApple AppDir/usr/bin/JoaKApple
          cp packaging/linux/JoaKApple.desktop AppDir/JoaKApple.desktop
          cp packaging/linux/icon.png AppDir/JoaKApple.png
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/JoaKApple/JoaKApple

      - name: Baixar appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Gerar AppImage
        run: |
          ./appimagetool --appimage-extract-and-run AppDir dist/JoaKApple-x86_64.AppImage

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/JoaKApple-x86_64.AppImage

  release:
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: JoaKApple ${{ needs.version.outputs.version }}
          body: |
            Toolkit para baixar, verificar e descriptografar retorno de ofícios judiciais da Apple.

            Autor: Joaquim Ferreira Silva Neto — joaquimfsneto@gmail.com
          generate_release_notes: true
          files: |
            artifacts/windows-exe/JoaKApple.exe
            artifacts/linux-appimage/JoaKApple-x86_64.AppImage
